import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    // Init scripts also run in React Native's included plugin builds.
    if (app == null) return
    app.tasks.register('qianlesimDependencyInventory') {
        doLast {
            def resolution = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult
            if (resolution.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                throw new GradleException('Unresolved Android dependency; refusing an incomplete audit')
            }
            def components = resolution.allComponents
            def packages = components.findAll { it.id instanceof ModuleComponentIdentifier }.collect {
                [name: "${it.id.group}:${it.id.module}".toString(), version: it.id.version]
            }.sort { a, b -> a.name <=> b.name }
            if (packages.isEmpty()) throw new GradleException('Empty Android dependency inventory')
            def output = new File(gradle.rootProject.projectDir.parentFile, 'dist/security/maven-inventory.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(packages)) + '\n'
            println "Recorded ${packages.size()} resolved Android release dependencies"
        }
    }
}
