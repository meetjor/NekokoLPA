name: Custom Android APK

on:
  push:
    branches:
      - fix/esim-loading-clean-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Use available Android SDK 36 for CI
        run: |
          sed -i 's/compileSdkVersion = 37/compileSdkVersion = 36/g; s/buildToolsVersion = "37.0.0"/buildToolsVersion = "36.0.0"/g' android/build.gradle
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Type-check
        run: yarn type-check
      - name: Apply default build variant
        run: bash apply_variant.sh store
      - name: Build signed release APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon
      - name: Collect APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NekokoLPA-custom-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
