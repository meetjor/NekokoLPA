name: Custom Android APK

on:
  push:
    branches:
      - fix/esim-loading-clean-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Type-check
        run: yarn type-check
      - name: Apply default build variant
        run: bash apply_variant.sh store
      - name: Build signed release APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon
      - name: Collect APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NekokoLPA-custom-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
