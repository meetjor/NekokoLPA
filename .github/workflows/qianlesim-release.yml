name: QianLesim ARM64 Release (cached)

on:
  push:
    branches: [feature/qianlesim-v1]
    paths:
      [
        src/**,
        android/**,
        variants/store/**,
        package.json,
        yarn.lock,
        scripts/capture-android-ui.py,
        scripts/prepare-notification-ui-check.cjs,
        scripts/ui-fixtures/**,
        .github/workflows/qianlesim-release.yml,
      ]
  workflow_dispatch:

concurrency:
  group: qianlesim-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and reject existing release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CODE="$(node -p "require('./package.json').buildVersion")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[1-9][0-9]*$ ]]
          TAG="v${VERSION}-qianlesim-3sign"
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > /tmp/existing-tags
          if grep -Fxq "$TAG" /tmp/existing-tags; then
            echo "Release tag already exists: $TAG. Increment version before building."
            exit 1
          fi
          test -f "docs/releases/${VERSION}.md"
          printf 'version=%s\ntag=%s\n' "$VERSION" "$TAG" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/app/build/intermediates/cxx
          key: ${{ runner.os }}-native-qianlesim-v2-${{ hashFiles('yarn.lock', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-native-qianlesim-v2-
            ${{ runner.os }}-native-arm64-v1-
      - name: Configure Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          sed -i 's/compileSdkVersion = 37/compileSdkVersion = 36/g; s/buildToolsVersion = "37.0.0"/buildToolsVersion = "36.0.0"/g' android/build.gradle
      - name: Dependencies and TypeScript
        run: |
          corepack enable
          yarn install --immutable
          yarn type-check
          yarn test --runInBand
      - name: Prepare build
        run: bash apply_variant.sh store
      - name: Android HTTPS security tests
        working-directory: android
        run: bash gradlew :app:testReleaseUnitTest --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QianLesim-Native-Tests
          path: android/app/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
      - name: Assemble arm64 APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
      - name: Apply public three-signer signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -type f -name '*arm64*.apk' -print -quit)"
          test -n "$APK"
          unzip -p "$APK" rsp/gsma-ci.pem | openssl x509 -noout -fingerprint -sha256 | grep -qi '5E:3E:91:FD:45:43:27:C3:AF:5D:32:A7:A7:3B:BC:59:FE:43:AA:7D:85:FD:32:D5:DB:44:42:3F:80:A5:6B:B3'
          unzip -p "$APK" rsp/gd-smdp.pem | openssl x509 -noout -fingerprint -sha256 | grep -qi '2C:E2:D6:78:7F:3B:64:11:B8:9E:67:5E:7E:B3:E8:7F:88:17:9B:F5:B0:8A:6E:C7:8D:95:A6:16:77:00:C7:8B'
          OUTPUT="$PWD/dist/QianLesim-v${VERSION}-arm64.apk"
          sed -n '/^java -jar apksigner.jar sign/,/--next-signer --ks signer\/keys\/9esim.jks/p' variants/multisign/signing.sh > dist/sign-three.sh
          printf '  --out "%s" "%s"\n' "$OUTPUT" "$APK" >> dist/sign-three.sh
          bash dist/sign-three.sh
          java -jar apksigner.jar verify --verbose --print-certs "$OUTPUT" | tee dist/signing.txt
          grep -q 'Number of signers: 3' dist/signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/signing.txt
          for fingerprint in \
            dd0dddbee79fc418ccf1523e670ff62f22926ed76a8ff50b1b63106195deab13 \
            4139278aacce8338c03dc9a6b0172c1880e0a4949ff3e05292c2e781765026fa \
            6966004ad0161165335f9204f8f5a52df49fe068c9545c0c589c23221af8d3a4; do
            grep -q "certificate SHA-256 digest: $fingerprint" dist/signing.txt
          done
          (cd dist && sha256sum QianLesim-v${VERSION}-arm64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: QianLesim-3sign
          path: |
            dist/QianLesim-v${{ env.VERSION }}-arm64.apk
            dist/signing.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Prepare synthetic notification UI checks (never in published APK)
        run: node scripts/prepare-notification-ui-check.cjs
      - name: Build x86_64 APK for UI checks (not published)
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 UI smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install $(find android/app/build/outputs/apk/release -name '*x86_64*.apk' -print -quit)
            QL_UI_OUTPUT=dist/ui/api-35 python3 scripts/capture-android-ui.py --notification-fixture
      - name: Android 14 UI and system-bar checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install $(find android/app/build/outputs/apk/release -name '*x86_64*.apk' -print -quit)
            QL_UI_OUTPUT=dist/ui/api-34 python3 scripts/capture-android-ui.py --notification-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QianLesim-Android-UI
          path: dist/ui/
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QianLesim-3sign
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create "$TAG" \
            "dist/QianLesim-v${VERSION}-arm64.apk" dist/SHA256SUMS.txt dist/signing.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QianLesim v${VERSION} - Reliability and security (three-signer)" \
            --notes-file "docs/releases/${VERSION}.md" \
            --prerelease
